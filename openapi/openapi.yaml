openapi: 3.1.0

info:
  title: Travelog API
  version: 0.1.0
  description: |
    REST API for Travelog MVP1.

    Functional behavior is defined by:
    `doc/functional-requirements-mvp1.md`

    Technical architecture is defined by:
    `doc/technical-design-mvp1.md`

servers:
  - url: /api
    description: Travelog API

tags:
  - name: Health
  - name: Config
  - name: Scans
  - name: Photos
  - name: Trips
  - name: Trip Map
  - name: Trip Operations
  - name: Localities
  - name: Exclusion Zones
  - name: Settings
  - name: Data

paths:
  /stats:
    get:
      tags: [Trips]
      operationId: getStats
      summary: Full-history travel statistics
      description: |
        Read-only statistics of active trips, including manually created trips.
        Each trip is counted in its start year. Inclusive calendar days are
        allocated to their actual month/year, including days without photos.
        Uses saved trip dates, without reapplying current exclusion zones or
        day/locality exclusions. Archived trips are omitted. No period filters.
      responses:
        "200":
          description: Ascending years from the first active trip start through the current calendar year (always included, even without trips), including intervening empty years
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelStats"
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check API health
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /scans:
    post:
      tags: [Scans]
      operationId: startScan
      summary: Start a photo scan
      description: |
        Starts an asynchronous scan of the selected directory.
        The directory must be relative to the configured photo root.

        Only one scan may run at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartScanRequest"
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          description: Invalid scan request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    get:
      tags: [Scans]
      operationId: listScans
      summary: List scan history
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanList"

  /scans/{scanId}:
    get:
      tags: [Scans]
      operationId: getScan
      summary: Get scan status and progress
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans/{scanId}/errors:
    get:
      tags: [Scans]
      operationId: listScanErrors
      summary: List errors recorded for a scan
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "200":
          description: Scan errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanErrorList"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /scans/{scanId}/cancel:
    post:
      tags: [Scans]
      operationId: cancelScan
      summary: Request cancellation of a running scan
      description: |
        Asks the running scan to stop after the photo currently being
        processed. The scan is then marked as failed with a diagnostic
        message ("Scan cancelled by the user"); photos already saved
        remain in the database.

        The response returns immediately with the current scan snapshot.
      parameters:
        - $ref: "#/components/parameters/ScanId"
      responses:
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "404":
          description: Scan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Scan is not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /photos:
    get:
      tags: [Photos]
      operationId: listPhotos
      summary: List catalogued photos
      description: |
        Technical data listing of catalogued photos.

        Photos are not displayed as images in MVP1; this view exposes
        the persisted metadata only: original shoot timestamp, original
        GPS coordinates and the hierarchical administrative locality
        resolved by reverse geocoding when available.
      parameters:
        - name: metadataStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PhotoMetadataStatus"
          description: Filter by metadata status.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Photo list ordered by shoot date descending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoList"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /config:
    get:
      tags: [Config]
      operationId: getConfig
      summary: Get runtime configuration
      responses:
        "200":
          description: Runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"

    put:
      tags: [Config]
      operationId: updateConfig
      summary: Update the photo root path
      description: |
        Persists the photo root in the PostgreSQL `settings` table and
        applies the change immediately. An empty value clears the
        configuration.

        The path must be absolute and must exist as a directory.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConfigRequest"
      responses:
        "200":
          description: Updated runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
        "400":
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /data:
    delete:
      tags: [Data]
      operationId: deleteAllData
      summary: Delete all catalogued data
      description: |
        Irreversibly deletes every photo, scan, scan error, locality,
        geocoding cache entry, presence, trip, trip history record and
        application setting.

        The photo root configuration (settings table) is not modified.

        The operation is rejected while a scan is running.
      responses:
        "204":
          description: All data deleted
        "409":
          description: Another scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /data/export:
    get:
      tags: [Data]
      operationId: exportData
      summary: Export entire database as JSON backup
      description: |
        Consistent read-only JSON snapshot of every table
        (REPEATABLE READ transaction). Usable while the app is serving;
        does not block scans. The schema is not part of the backup
        (it is reproduced by the versioned migrations); only the data
        is exported.

        The response is a JSON document with format, version, exportedAt
        and one key per table containing its rows. The file is pretty-
        printed (indented) for readability.
      responses:
        "200":
          description: JSON backup document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDocument"
        "500":
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /data/import:
    post:
      tags: [Data]
      operationId: importData
      summary: Import database from JSON backup
      description: |
        Full restore of a backup document in a single transaction:
        TRUNCATE + inserts + sequence resync, committed together.
        Any failure rolls back and leaves the existing data untouched.

        The document is validated before the lock is taken, so an
        invalid file never blocks scans. The photo root of the local
        machine is preserved (the one in the backup is discarded).

        Rejected while a scan is running.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: |
                Raw JSON backup document produced by GET /data/export.
                Content-Type must be application/octet-stream.
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid backup document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another scan is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Unexpected internal error (rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips:
    get:
      tags: [Trips]
      operationId: listTrips
      summary: List trips
      description: |
        By default only active trips are returned.
        Archived/superseded trips can be requested explicitly.

        Results are ordered by start date descending by default.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TripListStatus"
          description: Filter by trip status.
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: |
            Free-text search by trip name or year/month.
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - startDateDesc
              - startDateAsc
          default: startDateDesc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Trip list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripList"

    post:
      tags: [Trips]
      operationId: createTrip
      summary: Create a trip manually
      description: |
        Creates a trip from an explicit manual operation.

        The trip can be created with explicit start/end dates, or with a
        list of manual days (each with the visited localities, resolved
        beforehand via POST /localities/resolve). When days are provided
        the trip interval is derived from the minimum and maximum day
        dates and the days are persisted as manual trip days. Manual
        days ignore exclusion zones (explicit user intent).

        This endpoint is not used by automatic scan processing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequest"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Trip overlaps another active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/export:
    get:
      tags: [Trips]
      operationId: exportTrips
      summary: Export the active trips as CSV
      description: |
        Downloads a CSV file describing every active trip exactly as shown
        in the trips page: year, Italian month, start/end dates, name and
        duration, plus one row per day and visited locality with the
        locality hierarchy in a single comma-joined column and the photo
        count. Days without photos (gaps of 1–2 days) are exported with
        the "Nessuna foto" note.

        The file uses a `;` field separator and a UTF-8 BOM.
      responses:
        "200":
          description: CSV export of the active trips
          content:
            text/csv:
              schema:
                type: string
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/{tripId}:
    get:
      tags: [Trips]
      operationId: getTrip
      summary: Get trip details
      description: |
        Returns the trip data plus the chronology of its days: visited
        localities with administrative hierarchy and photo counts per
        day/locality; days without photos (gaps of 1–2 days) are listed
        with the "Nessuna foto" marker (functional requirements §16).
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "200":
          description: Trip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    patch:
      tags: [Trips]
      operationId: updateTrip
      summary: Modify a trip manually
      description: |
        Allows the manual modifications supported by MVP1:
        rename and/or change start/end dates.

        Automatic processing never modifies an existing trip.

        Active trips must not overlap temporally.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequest"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          description: Invalid modification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Modification would overlap another active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    delete:
      tags: [Trips]
      operationId: deleteTrip
      summary: Delete a trip
      description: |
        Explicit user operation: removes a trip whose period is not a
        trip. The deletion is recorded in the operations audit trail
        with a snapshot of the deleted trip (functional requirements
        §14). Photographs and presences are not deleted.
      parameters:
        - $ref: "#/components/parameters/TripId"
      responses:
        "204":
          description: Trip deleted
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/{tripId}/days:
    put:
      tags: [Trips]
      operationId: replaceTripDays
      summary: Replace the days of a trip
      description: |
        Explicit user operation: full replacement of the visible days
        (date + visited localities) of an active trip, in one atomic
        operation. Used both to add and to remove days after creation.

        On manually created trips the manual day rows are replaced and
        the trip interval follows the remaining days (extending the
        start/end dates is subject to the temporal overlap validation
        against other active trips, 409).

        On auto-generated trips the photo-derived days come from the
        photo presences: days/localities missing from the request are
        persisted as explicit, reversible day exclusions (they survive
        re-scans and recalculation) while additional localities are
        stored as manual day rows. The trip interval does not change;
        requested days must fall inside it (400 otherwise).

        The trip must keep at least one day. Archived trips cannot be
        modified.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTripDaysRequest"
      responses:
        "200":
          description: Updated trip with its days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "400":
          description: Invalid days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Date extension would overlap another active trip, or trip is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/map:
    get:
      tags: [Trip Map]
      operationId: getTripsOverviewMap
      summary: Get overview map data for all active trips
      description: |
        Returns a single marker per unique locality (name + county + region)
        across all active trips — presence localities within each trip's
        interval (respecting the day/locality exclusions) plus the manual-day
        localities, deduplicated. Suitable for the panoramic overview map
        shown before a specific trip is selected.

        The aggregation is served from a persistent read-through cache
        (`POST /trips/map/recalculate` refreshes it): `computedAt` reports
        when the served snapshot was computed, so the client can show the
        data age and offer an explicit recalculation.

        Coordinates are extracted from the geocoding cache locality hashes;
        region-based colors are assigned deterministically. `firstPhotoAt` is
        null for manual localities without photos.
      responses:
        "200":
          description: Overview map data (cached; `computedAt` is its snapshot time)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripsOverviewMap"

  /trips/map/recalculate:
    post:
      tags: [Trip Map]
      operationId: recalculateTripsOverviewMap
      summary: Explicitly recalculate the cached overview map
      description: |
        Recomputes the overview aggregation (one marker per unique locality
        across all active trips), overwrites the persistent cache read by
        `GET /trips/map` and returns the fresh data. The operation is
        synchronous and explicit: no other API operation triggers it.
      responses:
        "200":
          description: Freshly computed overview map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripsOverviewMap"

  /trips/{tripId}/map:
    get:
      tags: [Trip Map]
      operationId: getTripMapData
      summary: Get trip map visualization data
      description: |
        Returns marker data for rendering a trip map: one marker per
        locality listed in the trip detail (§16) — presence localities
        within the trip interval plus the localities of the trip's manual
        days — aggregated by administrative name (name + county + region)
        so repeated coordinate hashes of the same locality produce a
        single waymark. Ordered chronologically by first photo timestamp
        (or first manual day when no photos exist). Coordinates are
        extracted from the geocoding cache locality hashes; region-based
        colors are assigned deterministically.

        `firstPhotoAt` is null for manual localities without photos.
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Trip map data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripMapData"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/{tripId}/split:
    post:
      tags: [Trips]
      operationId: splitTrip
      summary: Split a trip
      description: |
        Splits a trip at the specified date.

        The split date belongs to the second resulting trip.
        The original trip remains in history.
      parameters:
        - $ref: "#/components/parameters/TripId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitTripRequest"
      responses:
        "200":
          description: Split result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationResult"
        "400":
          description: Invalid split date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Split would violate trip constraints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /trips/merge:
    post:
      tags: [Trips]
      operationId: mergeTrips
      summary: Merge two or more trips
      description: |
        Merges two or more trips into a new trip.

        Original trips are retained in history and marked as superseded.
        The resulting trip keeps a relationship to the source trips.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTripsRequest"
      responses:
        "200":
          description: Merge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationResult"
        "400":
          description: Invalid merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: One or more trips were not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Trips cannot be merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /operations:
    get:
      tags: [Trip Operations]
      operationId: listTripOperations
      summary: List trip operations (audit trail)
      description: |
        Chronological history of the manual trip operations (split, merge).
        Each entry records the source trips, the resulting trips and the
        timestamp of the operation (functional requirements §14).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Operation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOperationList"

  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get current settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update settings
      description: |
        Updates one or more setting values.

        Only provided fields are updated; omitted fields remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Invalid settings update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    post:
      tags: [Settings]
      operationId: recalculate
      summary: Trigger trip recalculation
      description: |
        Requests an explicit trip recalculation using the current global settings.
        Without a body (or with an empty object), all photos participate.
        With startDate and endDate, only photo days within the inclusive range
        participate in trip generation. Both dates must be supplied together and
        startDate must not be after endDate. Days outside the range do not
        contribute to consecutive-day thresholds or extend new trips.
        Existing trips remain protected against modifications and overlaps.
        Derived presences are still rebuilt globally; the range limits generation only.

        The operation returns immediately with ACCEPTED status.
        Actual recalculation proceeds asynchronously.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecalculateRequest"
      responses:
        "202":
          description: Recalculation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recalculation"
        "400":
          description: Invalid recalculation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /exclusion-zones:
    get:
      tags: [Exclusion Zones]
      operationId: listExclusionZones
      summary: List exclusion zones
      responses:
        "200":
          description: Exclusion zone list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExclusionZone"

    post:
      tags: [Exclusion Zones]
      operationId: createExclusionZone
      summary: Create an exclusion zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExclusionZoneRequest"
      responses:
        "201":
          description: Exclusion zone created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExclusionZone"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Administrative area not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /exclusion-zones/{id}:
    delete:
      tags: [Exclusion Zones]
      operationId: deleteExclusionZone
      summary: Delete an exclusion zone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "204":
          description: Deleted
        "404":
          description: Exclusion zone not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /localities/search:
    get:
      tags: [Localities]
      operationId: searchLocalities
      summary: Search localities by name, region or county
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query (matches name, region, county)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum results to return
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Locality"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /localities/autocomplete:
    get:
      tags: [Localities]
      operationId: autocompleteLocalities
      summary: Global locality search via Geoapify Address Autocomplete
      description: |
        Proxies the Geoapify Geocoding Autocomplete API to search any place
        worldwide, not only localities already imported from photo geocoding.
        Requires the GEOAPIFY_API_KEY environment variable to be configured.
        The results are suggestions: use POST /localities/resolve to persist
        the chosen place and obtain a Locality with an id usable for
        exclusion zones.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search text (place name or partial address)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          description: Maximum suggestions to return
      responses:
        "200":
          description: Autocomplete suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutocompleteLocalityList"
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Geoapify API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /localities/resolve:
    post:
      tags: [Localities]
      operationId: resolveLocality
      summary: Resolve a Geoapify place into a persisted Locality
      description: |
        Fetches the place details from Geoapify by place id, upserts it into
        the localities table (creating it if it has never been geocoded
        before) and returns the contract Locality with its database id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveLocalityRequest"
      responses:
        "200":
          description: Resolved locality (persisted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Locality"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Place not found on Geoapify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Geoapify API key not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"


components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based)
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size
    ScanId:
      name: scanId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    TravelStats:
      type: object
      additionalProperties: false
      required: [years]
      properties:
        years:
          type: array
          description: Ascending years from the first active trip start to the current calendar year (always included); empty if no active trips
          items:
            $ref: "#/components/schemas/TravelStatsYear"

    TravelStatsYear:
      type: object
      additionalProperties: false
      required: [year, tripCount, dayCount, months]
      properties:
        year:
          type: integer
        tripCount:
          type: integer
          minimum: 0
          description: Trips starting in this year
        dayCount:
          type: integer
          minimum: 0
          description: Sum of inclusive trip days falling in this year
        months:
          type: array
          description: Day counts from January to December, including zeros
          minItems: 12
          maxItems: 12
          items:
            type: integer
            minimum: 0

    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Stable machine-readable error code in uppercase snake case.
            Missing resources use TRIP_NOT_FOUND, SCAN_NOT_FOUND,
            LOCALITY_NOT_FOUND or EXCLUSION_ZONE_NOT_FOUND as appropriate.
          example: TRIP_NOT_FOUND
        message:
          type: string
          example: Trip not found
        details:
          type: object
          additionalProperties: true

    BackupDocument:
      type: object
      additionalProperties: false
      required: [format, version, exportedAt, tables]
      properties:
        format:
          type: string
          description: Backup format identifier (always "travelog-backup")
          example: travelog-backup
        version:
          type: integer
          description: Backup format version
          example: 1
        exportedAt:
          type: string
          description: Naive local timestamp of the export (YYYY-MM-DDTHH:mm:ss)
          example: "2026-09-26T14:47:12"
        tables:
          type: object
          description: One key per table containing an array of row objects
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true

    ImportResult:
      type: object
      additionalProperties: false
      required: [totalRows, counts]
      properties:
        totalRows:
          type: integer
          description: Total number of rows restored across all tables
          example: 1234
        counts:
          type: object
          description: Row count per table
          additionalProperties:
            type: integer
            example: 100

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, uptime_seconds, version, environment]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: number
        version:
          type: string
          example: "0.1.0"
        environment:
          type: string
          example: development

    StartScanRequest:
      type: object
      additionalProperties: false
      required: [folder]
      properties:
        folder:
          type: string
          maxLength: 1024
          description: |
            Directory to scan, relative to the configured photo root.
            An empty string scans the whole photo root.

    RuntimeConfig:
      type: object
      additionalProperties: false
      required: [photoRoot]
      properties:
        photoRoot:
          type: string
          nullable: true
          description: |
            Root directory of the photo archive (Settings → Percorso
            foto; stored in the settings table). Null when not yet
            configured.

    UpdateConfigRequest:
      type: object
      additionalProperties: false
      required: [photoRoot]
      properties:
        photoRoot:
          type: [string, "null"]
          description: |
            New photo root path. Must be absolute and exist as a directory.
            An empty string or null clears the configuration.

    ScanStatus:
      type: string
      enum:
        - pending
        - running
        - completed
        - completed_with_errors
        - failed
        - stopped

    Scan:
      type: object
      additionalProperties: false
      required:
        - id
        - folder
        - status
        - startedAt
        - filesAnalyzed
        - newPhotos
        - existingPhotos
        - excludedPhotos
        - errors
      properties:
        id:
          type: integer
          format: int64
        folder:
          type: string
        status:
          $ref: "#/components/schemas/ScanStatus"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        filesAnalyzed:
          type: integer
          nullable: true
        filesTotal:
          type: integer
          nullable: true
          description: |
            Total supported files found by enumeration (including
            subfolders). Known once enumeration completes; enables the
            proportional progress bar.
        newPhotos:
          type: integer
          nullable: true
        existingPhotos:
          type: integer
          nullable: true
        excludedPhotos:
          type: integer
          nullable: true
        errors:
          type: integer
          nullable: true
        errorMessage:
          type: string
          nullable: true

    ScanList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Scan"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ScanError:
      type: object
      additionalProperties: false
      required: [id, scanId, filePath, errorCode, message, createdAt]
      properties:
        id:
          type: integer
          format: int64
        scanId:
          type: integer
          format: int64
        filePath:
          type: string
        errorCode:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    ScanErrorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScanError"

    PhotoMetadataStatus:
      type: string
      enum: [valid, excluded]

    PhotoLocality:
      type: object
      additionalProperties: false
      required: [countryCode, name]
      properties:
        countryCode:
          type: string
        name:
          type: string
          description: Most specific administrative unit resolved by the geocoder
        county:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        country:
          type: string
          nullable: true

    Photo:
      type: object
      additionalProperties: false
      required:
        - id
        - filePath
        - fileName
        - fileType
        - dateTimeOriginal
        - originalLatitude
        - originalLongitude
        - metadataStatus
      properties:
        id:
          type: integer
          format: int64
        filePath:
          type: string
        fileName:
          type: string
        fileType:
          type: string
        dateTimeOriginal:
          type: string
          format: date-time
          nullable: true
          description: EXIF DateTimeOriginal as naive local time; null when unreadable/missing (excluded photos)
        originalLatitude:
          type: number
          nullable: true
        originalLongitude:
          type: number
          nullable: true
        metadataStatus:
          $ref: "#/components/schemas/PhotoMetadataStatus"
        exclusionReason:
          type: string
          nullable: true
        locality:
          description: Hierarchical administrative locality when reverse geocoding succeeded
          oneOf:
            - $ref: "#/components/schemas/PhotoLocality"
          nullable: true

    PhotoList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Trip:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, autoGenerated, createdManually, status, createdAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        autoGenerated:
          type: boolean
        createdManually:
          type: boolean
          description: |
            True ONLY for trips created by the user through the manual
            creation endpoint (with or without manual days). False for
            auto-generated trips and for the results of split/merge
            operations (a split result inherits the provenance of the
            original trip; a merge result is manual when at least one
            merged trip is manual).
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        photoCount:
          type: integer
          description: |
            Total number of valid photos (with GPS and geocoding) belonging
            to the trip. Computed from presences aggregated across all
            localities in the trip interval. Used by the trip card UI to
            show "N foto".
        regions:
          type: array
          items:
            type: string
          description: |
            Distinct administrative regions (counties and regions) visited
            during the trip, used as tags on the trip card. Ordered
            alphabetically.

    CreateTripRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
          description: |
            Trip start date. Required unless days are provided (in that
            case it is derived from the minimum day date and ignored).
        endDate:
          type: string
          format: date
          description: |
            Trip end date. Required unless days are provided (in that
            case it is derived from the maximum day date and ignored).
        days:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TripDayInput"
          description: |
            Manual trip days added one at a time by the user. When
            present, startDate/endDate are derived from the days.

    TripDayInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date:
          type: string
          format: date
        localityIds:
          type: array
          minItems: 1
          items:
            type: integer
          description: |
            Optional locality database ids (obtained via
            POST /localities/resolve). A day can be added to the trip
            before assigning its localities; the localities can be
            completed afterwards via PUT /trips/{tripId}/days.

    ReplaceTripDaysRequest:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TripDayInput"
          description: |
            Full replacement of the manual days of a trip (idempotent,
            atomic). If a day falls outside the current trip interval the
            trip start/end dates are extended accordingly (subject to the
            temporal overlap validation against other active trips).

    UpdateTripRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    SplitTripRequest:
      type: object
      additionalProperties: false
      required: [splitDate]
      properties:
        splitDate:
          type: string
          format: date
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Optional name for the second trip. When omitted, the system
            proposes one; the user can change it before confirming.

    MergeTripsRequest:
      type: object
      additionalProperties: false
      required: [tripIds]
      properties:
        tripIds:
          type: array
          minItems: 2
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
        title:
          type: [string, "null"]
          minLength: 1

    BoundingBox:
      type: object
      additionalProperties: false
      required: [minLat, minLon, maxLat, maxLon]
      properties:
        minLat:
          type: number
          format: double
        minLon:
          type: number
          format: double
        maxLat:
          type: number
          format: double
        maxLon:
          type: number
          format: double

    MapMarker:
      type: object
      additionalProperties: false
      required: [localityId, name, latitude, longitude, photoCount, firstPhotoAt, county, region, country, countyColor]
      properties:
        localityId:
          type: integer
          format: int64
        name:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        photoCount:
          type: integer
        firstPhotoAt:
          type: [string, "null"]
          format: date-time
          description: First photo timestamp within the trip; null for manual localities without photos
        county:
          type: [string, null]
        region:
          type: [string, null]
        country:
          type: [string, null]
        countyColor:
          type: string
          description: |-
            Hex color assigned deterministically to this locality's county
            (province). Localities in the same county share the same color;
            gray (#999999) when the county is unknown.

    TripMapData:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, bounds, markers, countyColors]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        bounds:
          $ref: "#/components/schemas/BoundingBox"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/MapMarker"
        countyColors:
          type: object
          additionalProperties:
            type: string
          description: Map county (province) name → hex_color for legend display

    TripsOverviewMap:
      type: object
      additionalProperties: false
      required: [bounds, markers, countyColors, computedAt]
      properties:
        bounds:
          $ref: "#/components/schemas/BoundingBox"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/MapMarker"
        countyColors:
          type: object
          additionalProperties:
            type: string
          description: Map county (province) name → hex_color for legend display
        computedAt:
          type: string
          format: date-time
          description: |
            When the served overview snapshot was computed (naive server local
            time, YYYY-MM-DDTHH:mm:ss). The overview is a persistent cached
            aggregation: compare this value with the current time to decide
            whether an explicit `POST /trips/map/recalculate` is due.

    TripOperationType:
      type: string
      enum: [SPLIT, MERGE, DELETE]

    TripOperation:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, sourceTripIds, resultingTripIds]
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TripOperationType"
        createdAt:
          type: string
          format: date-time
        sourceTripIds:
          type: array
          items:
            type: integer
            format: int64
        resultingTripIds:
          type: array
          items:
            type: integer
            format: int64

    TripOperationResult:
      type: object
      additionalProperties: false
      required: [operation, trips]
      properties:
        operation:
          $ref: "#/components/schemas/TripOperation"
        trips:
          type: array
          items:
            $ref: "#/components/schemas/Trip"

    TripOperationList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripOperation"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    TripDayLocality:
      type: object
      additionalProperties: false
      required: [localityId, name, photoCount, manual]
      properties:
        localityId:
          type: integer
        name:
          type: string
        county:
          type: [string, null]
        region:
          type: [string, null]
        country:
          type: [string, null]
        photoCount:
          type: integer
        manual:
          type: boolean
          description: |
            True when the day/locality was entered manually by the user
            (manual trip creation); false when derived from photo
            presences. Manual localities ignore exclusion zones.

    TripDay:
      type: object
      additionalProperties: false
      required: [date, noPhotos, localities, manual]
      properties:
        date:
          type: string
          format: date
        noPhotos:
          type: boolean
          description: |
            True for days without photos inside the trip (gaps of 1–2 days
            are listed with the "Nessuna foto" marker, §16).
        localities:
          type: array
          items:
            $ref: "#/components/schemas/TripDayLocality"
        manual:
          type: boolean
          description: |
            True when the day was created manually by the user (manual
            trip creation); false when derived from photo presences.

    TripDetail:
      type: object
      additionalProperties: false
      required: [id, name, startDate, endDate, autoGenerated, createdManually, status, createdAt, days]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        autoGenerated:
          type: boolean
        createdManually:
          type: boolean
          description: |
            True ONLY for trips created by the user through the manual
            creation endpoint (see the Trip schema).
        status:
          type: string
          enum: [active, archived]
        createdAt:
          type: string
          format: date-time
        days:
          type: array
          items:
            $ref: "#/components/schemas/TripDay"

    TripList:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Settings:
      type: object
      additionalProperties: false
      required: [minimumConsecutiveDaysWithPhotos, consecutiveDaysWithoutPhotosBeforeClosing]
      properties:
        minimumConsecutiveDaysWithPhotos:
          type: integer
          minimum: 1
          default: 2
        consecutiveDaysWithoutPhotosBeforeClosing:
          type: integer
          minimum: 0
          default: 3

    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        minimumConsecutiveDaysWithPhotos:
          type: integer
          minimum: 1
        consecutiveDaysWithoutPhotosBeforeClosing:
          type: integer
          minimum: 0

    RecalculateRequest:
      type: object
      additionalProperties: false
      dependentRequired:
        startDate: [endDate]
        endDate: [startDate]
      properties:
        startDate:
          type: string
          format: date
          description: Inclusive first photo day (naive local date).
        endDate:
          type: string
          format: date
          description: Inclusive last photo day; must be on or after startDate.

    Recalculation:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ACCEPTED]

    ExclusionZone:
      type: object
      additionalProperties: false
      required: [id, locality, scope]
      properties:
        id:
          type: integer
          format: int64
        locality:
          $ref: "#/components/schemas/Locality"
        scope:
          type: string
          enum: [locality, county, region]
          description: |
            Hierarchy level the exclusion applies to (§9.1): locality
            (comune), county (provincia) or region (regione).

    CreateExclusionZoneRequest:
      type: object
      additionalProperties: false
      required: [localityId]
      properties:
        localityId:
          type: integer
          format: int64
        scope:
          type: string
          enum: [locality, county, region]
          default: locality
          description: |
            Hierarchy level the exclusion applies to (§9.1): the locality
            itself, its county (provincia) or its region. The anchor
            locality must have the corresponding level.
          minimum: 1

    AutocompleteLocalityList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LocalitySuggestion"

    LocalitySuggestion:
      type: object
      additionalProperties: false
      required: [placeId, name, countryCode]
      properties:
        placeId:
          type: string
          description: Geoapify place id (use with POST /localities/resolve)
        name:
          type: string
          description: Locality name (city/town/village or most specific name)
        countryCode:
          type: string
        county:
          type: string
          nullable: true
          description: County/province, e.g. "Trapani"
        region:
          type: string
          nullable: true
          description: Region/state, e.g. "Sicily"
        country:
          type: string
          nullable: true
          description: Country name, e.g. "Italy"
        resultType:
          type: string
          nullable: true
          description: Geoapify result type (city, county, state, ...)

    ResolveLocalityRequest:
      type: object
      additionalProperties: false
      required: [placeId]
      properties:
        placeId:
          type: string
          minLength: 1
          description: Geoapify place id returned by the autocomplete endpoint

    Locality:
      type: object
      additionalProperties: false
      required: [id, source, countryCode, name, adminLevel, localityHash]
      properties:
        id:
          type: integer
          format: int64
        localityHash:
          type: string
          description: Coordinate hash key, e.g. "45.56:9.17"
        source:
          type: string
          description: Provider name (e.g. "geoapify")
        countryCode:
          type: string
        name:
          type: string
        adminLevel:
          type: integer
          description: Administrative level (0=highest, higher=more specific)
        region:
          type: string
          nullable: true
          description: Region/state, e.g. "Lombardia"
        county:
          type: string
          nullable: true
          description: County/province, e.g. "Monza e Brianza"
        country:
          type: string
          nullable: true
          description: Country name, e.g. "Italy"
        createdAt:
          type: string
          format: date-time

    TripListStatus:
      type: string
      enum: [active, archived]
