services:
  # ---------------------------------------------------------------------------
  # 1. BACKEND - Node Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: travelog-app-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate --workspace=@travelog/backend
    startCommand: npm start --workspace=@travelog/backend
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: travelog-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://travelog-app-frontend.onrender.com
      - key: GEOAPIFY_API_KEY
        sync: false # Render chiederà di inserire questa chiave al primo deploy
      - key: NODE_VERSION
        value: "22.0.0"

  # ---------------------------------------------------------------------------
  # 2. FRONTEND - Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: travelog-app-frontend
    region: frankfurt
    buildCommand: npm install && npm run build --workspace=@travelog/frontend
    staticPublishPath: frontend/dist
    autoDeploy: false
    envVars:
      - key: VITE_API_BASE_URL
        value: https://travelog-qe13.onrender.com
    routes:
      # Regola di Rewrite SPA per evitare l'errore 404 al Refresh delle pagine
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ---------------------------------------------------------------------------
  # 3. DATABASE - PostgreSQL 18
  # ---------------------------------------------------------------------------
  - name: travelog-db
    databaseName: travelog_6wn3
    user: travelog
    region: frankfurt
    plan: free
